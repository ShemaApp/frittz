name: Build and Deploy

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build with esbuild
        run: npm run build

      - name: Verify compiled folder
        run: |
          ls -la compiled/ || (echo "❌ compiled/ not found" && exit 1)
          echo "✅ Archivos compilados:"
          find compiled/ -name "*.js" -exec ls -lh {} \;

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./compiled/
          publish_branch: gh-pages
          exclude_assets: '.git,node_modules'

      - name: Upload compiled files as artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-files
          path: ./compiled/

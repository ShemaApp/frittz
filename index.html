<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Productos de la costa</title>
<link rel="manifest" href="./manifest.json"/>
<meta name="theme-color" content="#1E211D"/>
<link rel="icon" href="./icons/icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="P. Costa"/>
<link rel="apple-touch-icon" href="./icons/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#ECEDE7; --surface:#FFFFFF; --surface-2:#F1F1EA;
    --ink:#1B1D19; --ink-soft:#585D53; --ink-faint:#8B8F84;
    --line:#DEE0D5; --line-strong:#C7C9BB;
    --rail:#1E211D; --rail-border:#34372E; --rail-ink:#ECEDE7; --rail-ink-faint:#9A9E90;
    --accent:#E8A400; --accent-text:#8A5A00; --accent-ink:#1B1D19;
    --info:#3E7CA6; --info-text:#1F4E6E; --info-bg:#DEE7EC;
    --ok:#2E8B45; --ok-text:#1E6630; --ok-bg:#DFEFE2;
    --danger:#C23B2E; --danger-text:#8C2A20; --danger-bg:#F4DEDA;
    --warn:#C2601D; --warn-text:#8C4515; --warn-bg:#F3E4D3;
    --admin:#3B4B6B; --font-display:'Oswald',sans-serif; --font-body:'IBM Plex Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body)}
  #root{max-width:420px;margin:0 auto;min-height:100vh;position:relative}
  body{scrollbar-width:none}
  ::-webkit-scrollbar{display:none}
  input:focus{outline:none!important;border-color:var(--accent-text)!important}
  button,select{font-family:inherit}
  *{-webkit-tap-highlight-color:transparent}
  .loader{display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;gap:12px;font-family:var(--font-body);color:var(--ink-soft)}
  .spinner{width:40px;height:40px;border:4px solid var(--line-strong);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root">
  <div class="loader">
    <div class="spinner"></div>
    <div style="font-size:14px;font-weight:500">Cargando aplicación...</div>
  </div>
</div>

<!-- 1. Dependencias externas (CDN) con defer -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-app-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-auth-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-firestore-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-app-check-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<!-- 2. Código compilado (pre-transformado) - SIN Babel -->
<script src="./firebase-init.js"></script>
<script defer src="./compiled/app-core.js"></script>
<script defer src="./compiled/auth.js"></script>
<script defer src="./compiled/dashboard.js"></script>
<script defer src="./compiled/productos.js"></script>
<script defer src="./compiled/clientes.js"></script>
<script defer src="./compiled/pedidos.js"></script>
<script defer src="./compiled/creditos.js"></script>
<script defer src="./compiled/ruta.js"></script>
<script defer src="./compiled/config.js"></script>
<script defer src="./compiled/app.js"></script>
<script defer src="./compiled/rutas-repartidores.js"></script>
<script defer src="./compiled/inventario.js"></script>
<script defer src="./compiled/reportes.js"></script>
<script defer src="./compiled/gerencia.js"></script>
<script defer src="./compiled/permisos.js"></script>

<!-- 3. Inicialización -->
<script document.addEventListener('DOMContentLoaded', () => {
    const root = document.getElementById('root');
    root.innerHTML = '';
    
    if (window.App && window.ReactDOM) {
      window.ReactDOM.createRoot(root).render(window.React.createElement(window.App));
    } else {
      console.error('App no encontrada');
      root.innerHTML = '<div style="padding:40px;text-align:center;color:var(--danger-text)">Error al cargar la aplicación</div>';
    }
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registrado:', reg.scope))
        .catch(err => console.warn('SW no se pudo registrar:', err));
    });
  }
</script>
</body>
</html>

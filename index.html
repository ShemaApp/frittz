<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Productos de la costa</title>
<link rel="manifest" href="./manifest.json"/>
<meta name="theme-color" content="#1E211D"/>
<link rel="icon" href="./icons/icon-192.png"/>
<!-- iOS: Safari no lee manifest.json, necesita estas etiquetas aparte -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="P. Costa"/>
<link rel="apple-touch-icon" href="./icons/icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
<script defer crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script defer crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-app-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-auth-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-firestore-compat.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/firebase@10.13.0/firebase-app-check-compat.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
	<script defer src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    /* ── Tokens: industrial / logística, tema claro ── */
    --bg:#ECEDE7; --surface:#FFFFFF; --surface-2:#F1F1EA;
    --ink:#1B1D19; --ink-soft:#585D53; --ink-faint:#8B8F84;
    --line:#DEE0D5; --line-strong:#C7C9BB;
    --rail:#1E211D; --rail-border:#34372E; --rail-ink:#ECEDE7; --rail-ink-faint:#9A9E90;
    --accent:#E8A400; --accent-text:#8A5A00; --accent-ink:#1B1D19;
    --info:#3E7CA6; --info-text:#1F4E6E; --info-bg:#DEE7EC;
    --ok:#2E8B45; --ok-text:#1E6630; --ok-bg:#DFEFE2;
    --danger:#C23B2E; --danger-text:#8C2A20; --danger-bg:#F4DEDA;
    --warn:#C2601D; --warn-text:#8C4515; --warn-bg:#F3E4D3;
    --admin:#3B4B6B; --font-display:'Oswald',sans-serif; --font-body:'IBM Plex Sans',system-ui,sans-serif; --font-mono:'IBM Plex Mono',monospace;
  }
  html,body{height:100%;min-width:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow-x:hidden}
  #root{width:100%;max-width:none;margin:0;min-height:100vh;position:relative}
  body{scrollbar-width:none}
  .frittz-app-shell{width:100%;min-width:0}
  .frittz-topbar,.frittz-accent-bar,.frittz-offline-banner,.frittz-nav-shell{
    width:100%!important;max-width:none!important;left:0!important;transform:none!important
  }

  /* La experiencia móvil y escritorio comparten el ancho real del viewport.
     En pantallas anchas se reserva espacio para la navegación lateral. */
  @media (min-width:768px){
    #root{max-width:none!important;margin:0}
    .frittz-topbar,.frittz-accent-bar,.frittz-offline-banner,.frittz-nav-shell{
      max-width:none!important;left:0!important;transform:none!important
    }
    .frittz-main-content{
      width:100%;max-width:1600px;margin:0 auto;
      padding-left:260px;padding-right:28px
    }
    .frittz-topbar{padding-left:260px!important;padding-right:28px!important}
    .frittz-offline-banner{
      padding-left:260px!important;padding-right:28px!important;text-align:left!important
    }
    .frittz-nav-shell{right:0!important}
    .frittz-nav-shell nav{
      transform:translateX(0)!important;box-shadow:none!important
    }
    .frittz-menu-toggle{display:none!important}
    .frittz-login-shell{padding:48px 24px!important}
    .frittz-login-logo{width:100px!important;height:100px!important}
    .frittz-login-title{font-size:32px!important}
    .frittz-login-subtitle{font-size:13px!important;margin-bottom:32px!important}
    .frittz-login-panel{max-width:460px!important;padding:32px!important}
  }
  @media (min-width:1280px){
    .frittz-main-content{padding-left:280px;padding-right:40px}
    .frittz-topbar{padding-left:280px!important;padding-right:40px!important}
    .frittz-offline-banner{padding-left:280px!important;padding-right:40px!important}
  }
  ::-webkit-scrollbar{display:none}
  input:focus{outline:none!important;border-color:var(--accent-text)!important}
  button,select{font-family:inherit}
  *{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="root"><div style="display:flex;justify-content:center;align-items:center;height:100vh;color:var(--ink-soft);font-size:14px">Iniciando…</div></div>
<script defer src="./firebase-init.js"></script>
  <script defer src="./app-core.js"></script>
  <script defer src="./ventas-offline.js"></script>
  <script defer src="./sesion.js"></script>
<script defer src="./auth.js"></script>
<script defer src="./dashboard.js"></script>
<script defer src="./productos.js"></script>
<script defer src="./clientes.js"></script>
<script defer src="./pedidos.js"></script>
<script defer src="./creditos.js"></script>
<script defer src="./ruta.js"></script>
<script defer src="./config.js"></script>
<script defer src="./app.js"></script>
<script defer src="./rutas-repartidores.js"></script>
<script defer src="./inventario.js"></script>
<script defer src="./reportes.js"></script>
<script defer src="./gerencia.js"></script>
<script defer src="./permisos.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('SW registrado:', reg.scope))
        .catch(err => console.warn('SW no se pudo registrar:', err));
    });
  }
</script>
</body>
</html>
